<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <div class="container">

        <h1>Rock, Paper, Scissors?</h1>
        <h1 id="result"></h1>

        <div class="game">

            <div class="playerContainer">
                <h3>PLAYER</h3>
                <div class="score">
                    <img height="60px" src="images/man.png" alt="player icon">
                    <p>SCORE: <span id="playerScore">0</span></p>
                </div>
                <div class="rps">
                    <div class="rock">
                        <p>ROCK</p>
                        <img height="40%" src="./images/rock.png" alt="rock">
                    </div>
                    <div class="paper">
                        <p>PAPER</p>
                        <img height="40%" src="./images/paper.png" alt="paper">
                    </div>
                    <div class="scissors">
                        <p>SCISSORS</p>
                        <img height="40%" src="./images/scissors.png" alt="scissors">
                    </div>
                </div>
            </div>
    
            <div class="cpuContainer">
                <h3>COMPUTER</h3>
                <div class="score">
                    <img height="60px" src="./images/robot.png" alt="computer icon">
                    <p>SCORE: <span id="cpuScore">0</span></p>
                </div>
                <div class="rps">
                    <div class="rock">
                        <p>ROCK</p>
                        <img height="40%" src="./images/rock.png" alt="rock">
                    </div>
                    <div class="paper">
                        <p>PAPER</p>
                        <img height="40%" src="./images/paper.png" alt="paper">
                    </div>
                    <div class="scissors">
                        <p>SCISSORS</p>
                        <img height="40%" src="./images/scissors.png" alt="scissors">
                    </div>
                </div>
            </div>

        </div>

        <button id="reset">Reset</button>

    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
