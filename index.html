<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <div class="container">

        <h1>Rock, Paper, Scissors?</h1>

        <div class="game">

            <div class="playerContainer">
                <h3>PLAYER</h3>
                <div class="score">
                    <img src="" alt="player icon">
                    <p id="playerScore">SCORE:</p>
                </div>
                <div class="rps">
                    <div class="rock">
                        <p>ROCK</p>
                    </div>
                    <div class="paper">
                        <p>PAPER</p>
                    </div>
                    <div class="scissors">
                        <p>SCISSORS</p>
                    </div>
                </div>
            </div>
    
            <div class="cpuContainer">
                <h3>COMPUTER</h3>
                <div class="score">
                    <img src="" alt="computer icon">
                    <p id="playerScore">SCORE:</p>
                </div>
                <div class="rps">
                    <div class="rock">
                        <p>ROCK</p>
                    </div>
                    <div class="paper">
                        <p>PAPER</p>
                    </div>
                    <div class="scissors">
                        <p>SCISSORS</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
